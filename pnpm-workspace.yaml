packages:
  - packages/*
  - apps/*
allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  husky: true
  sharp: true
  supabase: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - driver.js@1.10.2
  - framer-motion@14.4.0
  - motion-dom@14.4.0
  - motion@14.4.0
peerDependencyRules:
  allowedVersions:
    eslint-plugin-import>eslint: '10'
    eslint-plugin-jsx-a11y>eslint: '10'
    eslint-plugin-react>eslint: '10'
