packages:
  - packages/*
  - apps/*
allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  husky: true
  sharp: true
  supabase: true
  unrs-resolver: true
peerDependencyRules:
  allowedVersions:
    eslint-plugin-import>eslint: '10'
    eslint-plugin-jsx-a11y>eslint: '10'
    eslint-plugin-react>eslint: '10'
