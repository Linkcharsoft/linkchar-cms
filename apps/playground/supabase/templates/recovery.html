<h2>Elegí una contraseña nueva</h2>
<p>Pediste recuperar la contraseña del panel de contenido. Entrá desde este link para elegir una nueva:</p>
<p><a href="{{ .SiteURL }}/dashboard/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery">Elegir una contraseña nueva</a></p>
