name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The playground has the package migrations
        run: pnpm --filter playground exec linkchar-cms migrations sync --check
      - name: The playground panel routes follow its config
        run: pnpm --filter playground exec linkchar-cms routes --check
      - run: pnpm lint-check
      - run: pnpm type-check
      - run: pnpm test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tarball that would be published
        run: pnpm --filter @linkcharsoft/cms pack --pack-destination "$RUNNER_TEMP/pack"
      - run: pnpm dlx publint@0.3.25 "$RUNNER_TEMP"/pack/*.tgz
      - name: Every entry point, the CLI and the migrations ship; no tests do
        run: node scripts/check-pack.mjs "$RUNNER_TEMP"/pack/*.tgz

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Local Supabase with the package migrations and the QA seed
        run: pnpm --filter playground exec supabase start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,supavisor
      - run: pnpm --filter playground db:test
      - run: pnpm --filter @linkcharsoft/cms test:db

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Local Supabase with the package migrations and the QA seed
        run: pnpm --filter playground exec supabase start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,supavisor
      - name: Playground environment from the local Supabase
        working-directory: apps/playground
        run: |
          eval "$(pnpm exec supabase status -o env)"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\nSUPABASE_SECRET_KEY=%s\nCMS_BUILD_HOOK_URL=\nCMS_MOCK_BUILD_RESULT=success\n' \
            "$API_URL" "$PUBLISHABLE_KEY" "$SECRET_KEY" > .env.local
      - run: pnpm --filter playground exec playwright install --with-deps chromium
      - run: pnpm --filter playground build
      - name: The same panel in English
        run: pnpm --filter playground build
        env:
          NEXT_PUBLIC_CMS_PANEL_LOCALE: en
          NEXT_DIST_DIR: .next-en
      - run: pnpm --filter playground test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/playground/playwright-report
