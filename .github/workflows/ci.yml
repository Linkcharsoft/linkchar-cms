name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The package never imports project code
        run: '! grep -rnE "from ''@/|from ''@playground/" packages/cms/src --include=*.ts --include=*.tsx --exclude-dir=__tests__'
      - run: pnpm lint-check
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm --filter playground build
